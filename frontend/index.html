

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LinkShort — URL Shortener</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f4f6fb;
    }

    main {
      width: 100%;
      max-width: 560px;
      padding: 36px;
      background: white;
      border: 1px solid #e5e9f2;
      border-radius: 20px;
      box-shadow: 0 16px 48px rgba(30, 45, 80, 0.08);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 30px;
    }

    .subtitle {
      margin: 0 0 28px;
      color: #667085;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .url-input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      font: inherit;
      outline: none;
    }

    .url-input:focus {
      border-color: #5268e8;
      box-shadow: 0 0 0 3px rgba(82, 104, 232, 0.12);
    }

    button {
      cursor: pointer;
      border: 0;
      border-radius: 10px;
      font: inherit;
      font-weight: 600;
    }

    #shorten-button {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      color: white;
      background: #5268e8;
    }

    #shorten-button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    #status {
      min-height: 22px;
      margin: 16px 0 0;
      color: #b42318;
      font-size: 14px;
    }

    #result {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 12px;
      background: #f1f4ff;
    }

    #short-link {
      display: block;
      overflow-wrap: anywhere;
      margin-bottom: 14px;
      color: #3448c5;
      font-weight: 600;
    }

    #copy-button {
      padding: 10px 16px;
      color: #3448c5;
      background: white;
      border: 1px solid #d9defb;
    }
  </style>
</head>
<body>
  <main>
    <h1>LinkShort</h1>
    <p class="subtitle">Turn long URLs into short, shareable links.</p>

    <form id="shorten-form">
      <label for="url-input">Paste your long URL</label>
      <input
        id="url-input"
        class="url-input"
        type="url"
        placeholder="https://www.instagram.com/"
        required
      />
      <button id="shorten-button" type="submit">Shorten URL</button>
    </form>

    <p id="status" role="status"></p>

    <section id="result" aria-live="polite">
      <a id="short-link" href="#" target="_blank" rel="noopener noreferrer"></a>
      <button id="copy-button" type="button">Copy link</button>
    </section>
  </main>

  <script>
    const API_URL = "https://url-shortener-api-o742.onrender.com";

    const form = document.querySelector("#shorten-form");
    const input = document.querySelector("#url-input");
    const shortenButton = document.querySelector("#shorten-button");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");
    const shortLink = document.querySelector("#short-link");
    const copyButton = document.querySelector("#copy-button");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      status.textContent = "";
      result.style.display = "none";
      shortenButton.disabled = true;
      shortenButton.textContent = "Shortening...";

      try {
        const response = await fetch(`${API_URL}/api/urls`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({
            original_url: input.value.trim()
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || "Could not shorten this URL.");
        }

        const generatedLink = `${API_URL}/${data.short_code}`;
        shortLink.href = generatedLink;
        shortLink.textContent = generatedLink;
        result.style.display = "block";
      } catch (error) {
        status.textContent =
          error.message === "Failed to fetch"
            ? "Could not connect to the API. Check the server or CORS configuration."
            : error.message;
      } finally {
        shortenButton.disabled = false;
        shortenButton.textContent = "Shorten URL";
      }
    });

    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(shortLink.href);
        copyButton.textContent = "Copied!";
        setTimeout(() => {
          copyButton.textContent = "Copy link";
        }, 1500);
      } catch {
        status.textContent = "Copy failed. Select and copy the link manually.";
      }
    });
  </script>
</body>
</html>
